<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt Lịch Hẹn</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex justify-center min-h-screen">
    <div class="w-full max-w-md bg-white shadow-xl rounded-2xl overflow-hidden flex flex-col">
        <div class="p-4 flex items-center border-b">
            <a href="/" class="text-gray-500 hover:text-gray-800 text-xl font-bold px-2">&lt;</a>
            <h1 class="text-lg font-bold mx-auto">Đặt Lịch Hẹn</h1>
        </div>

        <form action="/booking" method="POST" class="p-6 flex flex-col gap-5">
            <input type="hidden" name="service_type" value="{{ service_type }}">
            
            <!-- Family Hub Selection -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Người Cần Khám</label>
                <div class="border rounded-xl p-3 flex items-center gap-4 bg-gray-50">
                    <div class="w-12 h-12 rounded-full bg-gray-300 flex items-center justify-center text-2xl">👵</div>
                    <div>
                        <input type="text" name="patient_name" value="Bà Mai" class="font-bold text-gray-800 bg-transparent border-none outline-none" readonly>
                        <p class="text-xs text-gray-500">Tuổi: 70 | 70 Vườn Chuối, Q3...</p>
                    </div>
                </div>
            </div>

            <!-- Date & Time -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Ngày Khám</label>
                <input type="date" name="date" class="w-full border rounded-xl p-3 text-gray-700 focus:ring-2 focus:ring-purple-500 outline-none" required>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Giờ Hẹn</label>
                <div class="grid grid-cols-3 gap-2">
                    <label class="cursor-pointer">
                        <input type="radio" name="time" value="09:00" class="peer sr-only" required>
                        <div class="text-center p-2 rounded-lg border peer-checked:bg-purple-600 peer-checked:text-white peer-checked:border-purple-600 hover:bg-gray-100 transition">09:00</div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="time" value="10:00" class="peer sr-only">
                        <div class="text-center p-2 rounded-lg border peer-checked:bg-purple-600 peer-checked:text-white peer-checked:border-purple-600 hover:bg-gray-100 transition">10:00</div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="time" value="14:00" class="peer sr-only">
                        <div class="text-center p-2 rounded-lg border peer-checked:bg-purple-600 peer-checked:text-white peer-checked:border-purple-600 hover:bg-gray-100 transition">14:00</div>
                    </label>
                </div>
            </div>

            <!-- Symptoms -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Triệu Chứng Bơ Bộ</label>
                <textarea name="symptoms" rows="3" class="w-full border rounded-xl p-3 text-gray-700 focus:ring-2 focus:ring-purple-500 outline-none" placeholder="Ví dụ: Sốt nhẹ, mệt mỏi..."></textarea>
            </div>

            <button type="submit" class="w-full bg-purple-600 text-white font-bold text-lg py-4 rounded-xl mt-4 hover:bg-purple-700 transition shadow-lg">
                Xác Nhận Đặt Lịch
            </button>
        </form>
    </div>
</body>
</html>
