<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theo Dõi Ca Khám</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex justify-center min-h-screen">
    <div class="w-full max-w-md bg-white shadow-xl rounded-2xl overflow-hidden flex flex-col relative">
        <div class="p-4 flex items-center border-b">
            <a href="/" class="text-gray-500 hover:text-gray-800 text-xl font-bold px-2">&lt;</a>
            <h1 class="text-lg font-bold mx-auto">Theo Dõi Ca Khám</h1>
        </div>

        <div class="p-6 flex flex-col items-center">
            <div class="w-16 h-16 bg-purple-100 rounded-full flex items-center justify-center text-3xl mb-4">🚗</div>
            <h2 class="text-xl font-bold text-purple-700">Bác Sĩ Đang Di Chuyển!</h2>
            <p class="text-sm text-gray-500 text-center mt-1">Bác sĩ đang đến nhà khám cho <strong>{{ patient }}</strong></p>

            <!-- Map Placeholder -->
            <div class="w-full h-48 bg-gray-200 rounded-xl mt-6 flex items-center justify-center relative overflow-hidden">
                <p class="text-gray-500 font-semibold">[ Bản đồ thời gian thực ]</p>
                <div class="absolute left-4 top-1/2 bg-white px-3 py-1 rounded-full shadow font-bold text-sm text-purple-700">5 phút</div>
            </div>

            <!-- Doctor Info -->
            <div class="w-full border rounded-xl p-4 mt-6 flex items-center gap-4 bg-gray-50 shadow-sm">
                <div class="w-12 h-12 rounded-full bg-blue-100 flex items-center justify-center text-2xl">👨‍⚕️</div>
                <div>
                    <p class="font-bold text-gray-800">Bác Sĩ Nguyễn</p>
                    <p class="text-xs text-gray-500">SĐT: 09xx xxx xxx</p>
                </div>
            </div>

            <!-- Actions -->
            <div class="w-full flex flex-col gap-3 mt-6">
                <button class="w-full border border-purple-600 text-purple-600 font-bold py-3 rounded-xl hover:bg-purple-50 transition">
                    Liên Hệ Bác Sĩ
                </button>
                <button class="w-full border border-red-400 text-red-500 font-bold py-3 rounded-xl hover:bg-red-50 transition">
                    Yêu Cầu Hủy
                </button>
            </div>
        </div>
    </div>
</body>
</html>
